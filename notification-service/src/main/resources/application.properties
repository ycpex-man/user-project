server.port=0

spring.application.name=notification-service

eureka.client.service-url.defaultZone = http://localhost:8081/eureka

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=app.1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=org.example.dtos.UserEvent
spring.kafka.consumer.properties.spring.json.trusted-packages=*

resilience4j.circuitbreaker.instances.notificationServiceCircuit.register-health-indicator=true
resilience4j.circuitbreaker.instances.notificationServiceCircuit.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationServiceCircuit.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.notificationServiceCircuit.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationServiceCircuit.waitDurationInOpenState=5000

spring.mail.host=smtp.mail.ru
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
